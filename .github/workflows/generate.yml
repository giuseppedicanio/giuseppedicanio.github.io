name: Generate images list

on:
  push:
    paths:
      - "images/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate images.js
        run: |
          mkdir -p data
          ls images | grep -E '\.(jpg|jpeg|png|webp)$' > list.txt

          node -e "
          const fs = require('fs');
          const list = fs.readFileSync('list.txt','utf8')
            .split('\n')
            .filter(Boolean);

          fs.writeFileSync(
            'data/images.js',
            'window.IMAGES = ' + JSON.stringify(list, null, 2)
          );
          "

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase origin main
          git add data/images.js
          git commit -m 'update images' || echo 'no changes'
          git push
