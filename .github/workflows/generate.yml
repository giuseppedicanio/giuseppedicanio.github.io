name: Generate images list

on:
  push:
    paths:
      - "images/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate images.js sorted by date
        run: |
          mkdir -p data
          
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          // Leggi tutti i file immagini
          const files = fs.readdirSync('images')
            .filter(f => /\.(jpg|jpeg|png|webp)$/i.test(f));
          
          // Ottieni la data di commit per ogni file
          const filesWithDate = files.map(file => {
            try {
              const timestamp = execSync(
                \`git log -1 --format=%ct -- images/\${file}\`
              ).toString().trim();
              return {
                name: file,
                timestamp: parseInt(timestamp) || 0
              };
            } catch (e) {
              return { name: file, timestamp: 0 };
            }
          });
          
          // Ordina per data (dal più recente al più vecchio)
          filesWithDate.sort((a, b) => b.timestamp - a.timestamp);
          
          // Estrai solo i nomi
          const sortedNames = filesWithDate.map(f => f.name);
          
          // Salva in data/images.js
          fs.writeFileSync(
            'data/images.js',
            'window.IMAGES = ' + JSON.stringify(sortedNames, null, 2)
          );
          
          console.log('Immagini ordinate per data:');
          sortedNames.forEach(name => console.log('  ' + name));
          "

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/images.js
          git commit -m 'update images' || echo 'no changes'
          git pull --rebase origin main
          git push
